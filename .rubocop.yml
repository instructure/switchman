plugins:
  - rubocop-rails
  - rubocop-rake
  - rubocop-rspec_rails

inherit_gem:
  rubocop-inst:
  - rubocop.yml
  - rubocop-rspec.yml

AllCops:
  TargetRubyVersion: 3.2
  Exclude:
    - 'bin/*'

Bundler/DuplicatedGem:
  Enabled: false

Lint/EmptyBlock:
  Enabled: false

Rails/DynamicFindBy:
  Exclude:
    - spec/**/*.rb
Rails/FindBy:
  Exclude:
    - spec/**/*.rb
Rails/HasManyOrHasOneDependent:
  Enabled: false
Rails/SkipsModelValidations:
  Exclude:
    - spec/**/*.rb
Rails/WhereExists:
  EnforcedStyle: where

RSpec/AnyInstance:
  Enabled: false
RSpec/BeforeAfterAll:
  Enabled: false
RSpec/IndexedLet:
  Enabled: false
RSpec/InstanceVariable:
  Enabled: false
RSpec/VerifiedDoubles:
  Enabled: false

Style/CaseEquality:
  Enabled: false
Style/ClassVars:
  Enabled: false
Style/DocumentDynamicEvalDefinition:
  Enabled: false
Style/Documentation:
  Enabled: false
Style/ParallelAssignment:
  Enabled: false
Style/RescueModifier:
  Enabled: false
Style/SpecialGlobalVars:
  Enabled: false
Style/StringConcatenation:
  Enabled: false
